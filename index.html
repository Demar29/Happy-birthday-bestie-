<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naly's Birthday Smash! 🏸🧸</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #fbcfe8;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23f472b6' fill-opacity='0.25'%3E%3Cpath d='M0 0h30v30H0zM30 30h30v30H30z'/%3E%3C/g%3E%3C/svg%3E");
      color: #881337;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }
    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    .hud {
      position: absolute;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      text-align: center;
      width: 100%;
      padding: 0 10px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #9f1239;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9);
    }
    .score {
      font-size: 1.3rem;
      font-weight: bold;
      color: #be123c;
      margin-top: 4px;
      background: rgba(255, 255, 255, 0.8);
      display: inline-block;
      padding: 4px 16px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .hint {
      font-size: 0.85rem;
      color: #9f1239;
      margin-top: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="hud">
    <h1>🎀 Happy 16th Naly! 🎀</h1>
    <div class="score">Hits: <span id="score">0</span></div>
    <div class="hint">Use your Badminton Paddle 🏸 to bounce the items!</div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    const items = ['🧸', '🌹', '🐼', '🦫', '🍰', '🌧️', '✨'];
    const balls = [];

    const paddle = { x: canvas.width / 2, y: canvas.height - 100, radius: 40 };

    class BouncingItem {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.char = items[Math.floor(Math.random() * items.length)];
        this.size = 36;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = Math.random() * -4 - 3;
        this.gravity = 0.15;
      }

      draw() {
        ctx.font = `${this.size}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.char, this.x, this.y);
      }

      update() {
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;

        if (this.x - 15 < 0 || this.x + 15 > canvas.width) {
          this.vx *= -1;
        }

        const dist = Math.hypot(this.x - paddle.x, this.y - paddle.y);
        if (dist < paddle.radius + 15 && this.vy > 0) {
          this.vy = -Math.abs(this.vy) * 0.95 - 2;
          this.vx += (this.x - paddle.x) * 0.15;
          score++;
          scoreEl.innerText = score;
        }

        if (this.y > canvas.height + 50) {
          this.y = -20;
          this.x = Math.random() * canvas.width;
          this.vy = 2;
          this.vx = (Math.random() - 0.5) * 4;
        }
      }
    }

    for (let i = 0; i < 8; i++) {
      balls.push(new BouncingItem(Math.random() * canvas.width, Math.random() * (canvas.height / 2)));
    }

    function updatePaddle(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      paddle.x = clientX;
      paddle.y = clientY;
    }

    window.addEventListener('mousemove', updatePaddle);
    window.addEventListener('touchmove', updatePaddle);

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.font = '50px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🏸', paddle.x, paddle.y);

      balls.forEach(ball => {
        ball.update();
        ball.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
