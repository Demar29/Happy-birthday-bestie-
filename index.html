<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naly's Birthday Smash! 🏸🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }
    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    .hud {
      position: absolute;
      top: 15px; left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      text-align: center;
      width: 100%;
      padding: 0 10px;
    }
    h1 {
      font-size: 1.6rem;
      color: #f43f5e;
      text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
    }
    .score {
      font-size: 1.2rem;
      font-weight: bold;
      color: #facc15;
      margin-top: 4px;
    }
    .hint {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="hud">
    <h1>🎉 Happy 16th Naly! 🎉</h1>
    <div class="score">Hits: <span id="score">0</span></div>
    <div class="hint">Use your Badminton Paddle 🏸 to bounce the items!</div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    const items = ['🌹', '🐼', '🦫', '🍰', '🌧️', '✨'];
    const balls = [];

    // Paddle setup
    const paddle = { x: canvas.width / 2, y: canvas.height - 100, radius: 40 };

    class BouncingItem {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.char = items[Math.floor(Math.random() * items.length)];
        this.size = 32;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = Math.random() * -4 - 3;
        this.gravity = 0.15;
      }

      draw() {
        ctx.font = `${this.size}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.char, this.x, this.y);
      }

      update() {
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;

        // Bounce off walls
        if (this.x - 15 < 0 || this.x + 15 > canvas.width) {
          this.vx *= -1;
        }

        // Check collision with paddle
        const dist = Math.hypot(this.x - paddle.x, this.y - paddle.y);
        if (dist < paddle.radius + 15 && this.vy > 0) {
          this.vy = -Math.abs(this.vy) * 0.95 - 2;
          this.vx += (this.x - paddle.x) * 0.15;
          score++;
          scoreEl.innerText = score;
        }

        // Reset if it falls past bottom
        if (this.y > canvas.height + 50) {
          this.y = -20;
          this.x = Math.random() * canvas.width;
          this.vy = 2;
          this.vx = (Math.random() - 0.5) * 4;
        }
      }
    }

    // Spawn starting items
    for (let i = 0; i < 8; i++) {
      balls.push(new BouncingItem(Math.random() * canvas.width, Math.random() * (canvas.height / 2)));
    }

    // Track mouse / touch movement
    function updatePaddle(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      paddle.x = clientX;
      paddle.y = clientY;
    }

    window.addEventListener('mousemove', updatePaddle);
    window.addEventListener('touchmove', updatePaddle);

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Badminton Paddle Indicator
      ctx.font = '50px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🏸', paddle.x, paddle.y);

      // Update balls
      balls.forEach(ball => {
        ball.update();
        ball.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
